# Serial overlay for the THIRD UART endpoint (uart_endpoints[2].device, exported by
# `mavlink-router-up` as MAVROUTER_DEVICE_3). Always layered on top of
# compose.deploy.serial.yaml, which documents the mapping and grants the dialout group.
services:
  router:
    devices:
      - "${MAVROUTER_DEVICE_3}:${MAVROUTER_DEVICE_3}"
