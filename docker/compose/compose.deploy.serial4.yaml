# Serial overlay for the FOURTH UART endpoint (uart_endpoints[3].device, exported by
# `mavlink-router-up` as MAVROUTER_DEVICE_4). Always layered on top of
# compose.deploy.serial.yaml, which documents the mapping and grants the dialout group.
services:
  router:
    devices:
      - "${MAVROUTER_DEVICE_4}:${MAVROUTER_DEVICE_4}"
